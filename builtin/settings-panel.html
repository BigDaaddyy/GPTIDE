<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-__NONCE__'; script-src 'nonce-__NONCE__';"><style nonce="__NONCE__">
*{box-sizing:border-box}body{margin:0;color:var(--vscode-foreground);background:var(--vscode-editor-background);font:13px var(--vscode-font-family)}main{max-width:850px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--vscode-panel-border);padding-bottom:14px}h1{font-size:18px;margin:0}h2{font-size:14px;margin:24px 0 10px}p{color:var(--vscode-descriptionForeground);margin:8px 0;font-size:12px}.grow{flex:1}button,select,input,textarea{font:inherit;color:var(--vscode-input-foreground);background:var(--vscode-input-background);border:1px solid var(--vscode-input-border,var(--vscode-panel-border));border-radius:5px;padding:6px 8px}button{cursor:pointer}button:hover{background:var(--vscode-list-hoverBackground)}:focus-visible{outline:1px solid var(--vscode-focusBorder);outline-offset:2px}button:disabled{opacity:.5;cursor:default}.row{display:grid;grid-template-columns:minmax(180px,1fr) minmax(180px,1fr) 50px;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--vscode-panel-border)}small{display:block;color:var(--vscode-descriptionForeground);font-size:11px;margin-top:3px}.row input:not([type=checkbox]),.row select{width:100%;min-width:0}#project{overflow-wrap:anywhere}.row input[type=checkbox]{justify-self:start}#links{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}textarea{width:100%;resize:vertical;min-height:68px;line-height:1.5}.context-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block}label>span{display:block;margin:10px 0 6px}#rules{min-height:120px}#status{min-height:20px;white-space:pre-wrap}#effective{white-space:pre-wrap;line-height:1.6;color:var(--vscode-descriptionForeground)}.actions{display:flex;gap:6px;margin-top:10px}@media(max-width:620px){main{padding:16px}.row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 45px;gap:6px}.context-grid{grid-template-columns:1fr}header{flex-wrap:wrap}}
</style></head><body><main><header><h1>GptIDE 配置</h1><span class="grow"></span><select id="scope" aria-label="设置范围"><option value="user">用户</option><option value="project">当前项目</option></select></header><div id="links"><button data-command="advanced">全部设置</button><button data-command="config">Codex config.toml</button><button data-command="usage">用量</button><button data-command="diagnostics">诊断</button></div><p id="status" role="status"></p><div id="effective"></div><section><h2>会话与运行</h2><div id="fields"></div></section><section id="context"><h2>项目固定上下文</h2><p id="project"></p><div class="context-grid"><label><span>固定文件</span><textarea id="files" aria-label="固定文件" placeholder="项目相对路径，每行一个"></textarea></label><label><span>排除固定引用的文件或目录</span><textarea id="excluded" aria-label="排除目录" placeholder="项目相对路径，每行一个"></textarea></label></div><label><span>项目规则</span><textarea id="rules" aria-label="项目开发规则" maxlength="30000"></textarea></label><div class="actions"><button id="choose">选择文件</button><button id="save">保存项目上下文</button></div></section></main><script nonce="__NONCE__">
const api=acquireVsCodeApi(), el=id=>document.getElementById(id);let data, pending=false, contextDirty=false,editVersion=0;
const send=(type,values={})=>api.postMessage({type,projectKey:data?.projectKey,...values});
function status(value){el('status').textContent=value||''}
function render(value){data=value;el('scope').querySelector('[value=project]').disabled=!value.project;if(!value.project)el('scope').value='user';el('effective').textContent=value.effective;el('fields').replaceChildren();for(const field of value.fields){const row=document.createElement('div');row.className='row';const label=document.createElement('label'),title=document.createElement('span'),hint=document.createElement('small');title.textContent=field.label;hint.textContent=field.hint+' · '+field.source;label.append(title,hint);const input=document.createElement(field.enum?'select':'input');input.id='setting-'+field.key;label.htmlFor=input.id;if(field.enum)for(const item of field.enum){const option=document.createElement('option');option.value=option.textContent=item;input.append(option)}else input.type=field.type==='boolean'?'checkbox':field.type==='number'?'number':'text';if(field.type==='boolean')input.checked=field.value;else input.value=field.value;if(field.minimum!==undefined)input.min=field.minimum;if(field.maximum!==undefined)input.max=field.maximum;input.onchange=()=>{if(pending)return;pending=true;input.disabled=true;send('set',{key:field.key,value:field.type==='boolean'?input.checked:field.type==='number'?Number(input.value):input.value,scope:el('scope').value})};const reset=document.createElement('button');reset.textContent='重置';reset.onclick=()=>{if(pending)return;pending=true;reset.disabled=true;send('set',{key:field.key,reset:true,scope:el('scope').value})};row.append(label,input,reset);el('fields').append(row)}el('project').textContent=value.project||'先打开一个项目文件夹';for(const id of ['files','excluded','rules','choose','save'])el(id).disabled=!value.project||!value.contextAvailable;if(!contextDirty){el('files').value=(value.context.files||[]).join('\n');el('excluded').value=(value.context.excluded||[]).join('\n');el('rules').value=value.context.rules||''}}
window.addEventListener('message',event=>{const value=event.data;if(!value||typeof value!=='object')return;if(value.type==='live')el('effective').textContent=value.effective;if(value.type==='state'){pending=false;render(value);if(value.status!==undefined)status(value.status)}if(value.type==='files'){el('files').value=[...new Set([...el('files').value.split(/\r?\n/).filter(Boolean),...value.files])].join('\n');contextDirty=true;editVersion++}if(value.type==='contextSaved'&&value.editVersion===editVersion){contextDirty=false}if(value.type==='error'){pending=false;status(value.message);if(data)render(data)}});
for(const button of document.querySelectorAll('[data-command]'))button.onclick=()=>send(button.dataset.command);for(const id of ['files','excluded','rules'])el(id).oninput=()=>{contextDirty=true;editVersion++};el('choose').onclick=()=>send('choose');el('save').onclick=()=>{if(pending)return;pending=true;send('context',{editVersion,files:el('files').value.split(/\r?\n/).map(value=>value.trim()).filter(Boolean),excluded:el('excluded').value.split(/\r?\n/).map(value=>value.trim()).filter(Boolean),rules:el('rules').value})};el('scope').onchange=()=>send('refresh');send('refresh');
</script></body></html>
