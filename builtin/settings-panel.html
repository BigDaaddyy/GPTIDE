<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-__NONCE__'; script-src 'nonce-__NONCE__';"><style nonce="__NONCE__">
*{box-sizing:border-box}body{margin:0;color:var(--vscode-foreground);background:var(--vscode-editor-background);font:13px var(--vscode-font-family)}main{max-width:850px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--vscode-panel-border);padding-bottom:14px}h1{font-size:18px;margin:0}h2{font-size:14px;margin:24px 0 10px}p{color:var(--vscode-descriptionForeground);margin:8px 0;font-size:12px}.grow{flex:1}button,select,input,textarea{font:inherit;color:var(--vscode-input-foreground);background:var(--vscode-input-background);border:1px solid var(--vscode-input-border,var(--vscode-panel-border));border-radius:5px;padding:6px 8px}button{cursor:pointer}button:hover{background:var(--vscode-list-hoverBackground)}:focus-visible{outline:1px solid var(--vscode-focusBorder);outline-offset:2px}button:disabled{opacity:.5;cursor:default}.row{display:grid;grid-template-columns:minmax(180px,1fr) minmax(180px,1fr) 50px;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--vscode-panel-border)}small{display:block;color:var(--vscode-descriptionForeground);font-size:11px;margin-top:3px}.row input:not([type=checkbox]),.row select{width:100%;min-width:0}#project{overflow-wrap:anywhere}.row input[type=checkbox]{justify-self:start}#links{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}textarea{width:100%;resize:vertical;min-height:68px;line-height:1.5}.context-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block}label>span{display:block;margin:10px 0 6px}#rules{min-height:120px}#status{min-height:20px;white-space:pre-wrap}#effective{white-space:pre-wrap;line-height:1.6;color:var(--vscode-descriptionForeground)}.actions{display:flex;gap:6px;margin-top:10px}@media(max-width:620px){main{padding:16px}.row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 45px;gap:6px}.context-grid{grid-template-columns:1fr}header{flex-wrap:wrap}}
.error{color:var(--vscode-errorForeground)}.actions{align-items:center;flex-wrap:wrap}#context-status{font-size:11px;color:var(--vscode-descriptionForeground)}.row small{overflow-wrap:anywhere}input:disabled,select:disabled{opacity:.65}</style></head><body><main><header><h1>GPTIDE 配置</h1><span class="grow"></span><select id="scope" aria-label="设置范围"><option value="user">用户</option><option value="project">当前项目</option></select></header><div id="links"><button data-command="advanced">全部设置</button><button data-command="config">Codex config.toml</button><button data-command="usage">用量</button><button data-command="diagnostics">诊断</button></div><p id="status" role="status"></p><div id="effective"></div><section><h2>会话与运行</h2><div id="fields"></div></section><section id="context"><h2>项目固定上下文</h2><p id="project"></p><div class="context-grid"><label><span>固定文件</span><textarea id="files" aria-label="固定文件" placeholder="项目相对路径，每行一个"></textarea></label><label><span>排除固定引用的文件或目录</span><textarea id="excluded" aria-label="排除目录" placeholder="项目相对路径，每行一个"></textarea></label></div><label><span>项目规则</span><textarea id="rules" aria-label="项目开发规则" maxlength="30000"></textarea></label><div class="actions"><button id="choose">选择文件</button><button id="save">保存项目上下文</button><button id="context-reset" title="恢复最近保存的输入，不修改配置文件">还原输入</button><span id="context-status" role="status"></span></div></section></main><script nonce="__NONCE__">__SCRIPT__</script></body></html>
