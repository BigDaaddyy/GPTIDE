<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-__NONCE__'; script-src 'nonce-__NONCE__';"><meta name="viewport" content="width=device-width, initial-scale=1"><style nonce="__NONCE__">__STYLE__</style></head>
<body data-project-key="__PROJECT_KEY__">
<header class="header"><div class="toolbar"><nav id="chat-tabs" class="chat-tabs" role="tablist" aria-label="项目对话"></nav><button id="new" class="icon-button" title="新对话 Ctrl+Shift+L" aria-label="新对话">＋</button><button id="history" class="icon-button" title="聊天历史" aria-label="聊天历史">◷</button><button id="more" class="icon-button" title="更多操作" aria-label="更多操作">⋯</button></div><div id="menu" class="popup" hidden><button id="find">查找对话 Ctrl+F</button><button id="export">导出完整对话</button><button id="rename">重命名对话</button><button id="refresh">重新读取项目进度</button><button id="reconnect">重新连接（不重发任务）</button><button id="login">ChatGPT 登录</button><button id="attachDiagnostics">引用项目诊断</button><button id="attachGitDiff">引用 Git 差异</button><button id="attachFolder">引用文件夹</button><button id="usage">快速查看用量</button><button id="settings">会话与 Codex 配置</button><div class="menu-info"><span id="project"></span><span id="chat-title"></span><span id="connection" class="connection"></span><span id="plan"></span></div><button id="attachCurrent">引用选区</button><button id="task-toggle">任务记录</button><button id="folder">打开文件夹</button><button id="terminal">显示终端</button><button id="delete" class="danger">删除本地记录</button></div></header>
<aside id="history-panel" class="history-panel" hidden><div class="history-heading"><strong>项目对话</strong><span class="spacer"></span><button id="history-archived" class="text-button" aria-pressed="false">Archived</button><button id="close-history" class="icon-button" aria-label="关闭历史">×</button></div><input id="history-search" type="search" placeholder="搜索对话…" aria-label="搜索对话"><div id="history-list" class="history-list"></div></aside>

<div id="find-bar" class="find-bar" hidden><input id="find-query" type="search" maxlength="200" placeholder="查找当前对话" aria-label="查找当前对话"><span id="find-count" aria-live="polite">0/0</span><button id="find-prev" aria-label="上一条匹配">↑</button><button id="find-next" aria-label="下一条匹配">↓</button><button id="find-close" aria-label="关闭查找">×</button></div><main id="messages" class="messages" aria-label="对话内容"></main><button id="scroll-bottom" class="scroll-bottom" hidden>↓ 最新消息</button>
<details id="task-panel" class="task-panel" hidden><summary>任务过程 <span id="task-count"></span></summary><div class="task-controls"><select id="task-filter" aria-label="任务轮次"><option value="all">所有轮次</option></select><button id="task-failures" aria-pressed="false">仅失败</button><span class="spacer"></span><button id="task-copy">复制日志</button></div><div id="task-empty" class="task-empty" hidden>没有匹配步骤</div><div id="task-list" class="task-list"></div></details>
<section id="review" class="review" aria-label="Agent 文件改动" hidden><div class="review-header"><button id="review-toggle" aria-expanded="false" aria-controls="review-files"><span id="review-arrow" aria-hidden="true">›</span><span id="review-count"></span></button><button id="review-undo" title="撤销本轮修改">Undo</button><button id="review-keep" title="保留本轮修改">Keep</button><button id="review-open" title="在源代码管理中检查">Review</button></div><div id="review-files" hidden></div></section>
<footer class="footer"><div class="footer-context"><div id="login-state" class="login-state" hidden><span>正在登录 ChatGPT</span><span class="spacer"></span><button id="cancel-login">取消等待</button></div><div id="recovery" class="recovery" hidden><span id="recovery-label"></span><span class="spacer"></span><button id="recover-connect">连接</button><button id="restore-request">取回指令</button></div><details id="queue-panel" class="queue-panel" hidden><summary>待处理 <span id="queue-count"></span></summary><div class="queue-controls"><span id="queue-status"></span><span class="spacer"></span><button id="queue-pause">暂停队列</button></div><div id="queue-list"></div></details><div id="activity" class="activity" hidden><span class="pulse"></span><span id="activity-text"></span></div><div id="warning" class="warning" role="alert" hidden></div></div><div class="composer"><div id="model-panel" class="model-panel" role="dialog" aria-label="模型与思考强度" hidden><div class="model-heading"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m13 2-9 12h7l-1 8 10-13h-7z"/></svg><select id="model" aria-label="模型"></select><span id="effort-label"></span></div><select id="effort" aria-label="推理强度" hidden></select><div class="effort-track"><div id="effort-ticks" aria-hidden="true"></div><input id="effort-slider" type="range" min="0" max="0" step="1" value="0" aria-label="思考强度"></div></div><div id="quick-actions" class="quick-actions" role="listbox" aria-label="聊天快捷操作" hidden></div><div id="attachments" class="attachments"></div><textarea id="input" placeholder="输入指令，/ 操作，@ 引用" aria-controls="quick-actions" aria-expanded="false" aria-label="消息" rows="1" maxlength="100000" disabled></textarea><div class="composer-controls"><select id="mode" aria-label="工作模式"><option value="agent">Agent</option><option value="ask">Ask</option><option value="plan">Plan</option></select><button id="model-toggle" aria-label="选择模型" aria-haspopup="dialog" aria-expanded="false" aria-controls="model-panel"><span id="model-label">选择模型</span><span aria-hidden="true">⌄</span></button><button id="attach" class="composer-action" title="引用文件" aria-label="引用文件"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m21 11-9 9a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.7 5.7l-9 9a2 2 0 0 1-2.8-2.8l8.3-8.3"/></svg></button><button id="enqueue" class="composer-action" title="加入当前对话队列" aria-label="加入队列" hidden>＋</button><button id="send" class="send" title="发送消息" aria-label="发送消息">↑</button></div></div><div id="status" class="inline-status" role="status" hidden>加载中</div><span id="draft-state" class="sr-only" role="status"></span></footer>
<script nonce="__NONCE__">__MARKDOWN__
__CODE__
__FIND__
__ACTIONS__
__SCRIPT__</script>
</body></html>
