<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-__NONCE__'; script-src 'nonce-__NONCE__';"><meta name="viewport" content="width=device-width, initial-scale=1"><style nonce="__NONCE__">__STYLE__</style></head>
<body data-project-key="__PROJECT_KEY__">
<header class="header"><div class="toolbar"><strong>Agent</strong><span id="connection" class="connection" title="会员连接状态"></span><div class="spacer"></div><button id="history" class="icon-button" title="聊天历史" aria-label="聊天历史">◷</button><button id="new" class="icon-button" title="新对话 Ctrl+Shift+L" aria-label="新对话">＋</button><button id="more" class="icon-button" title="更多操作" aria-label="更多操作">⋯</button></div><div class="breadcrumb"><span id="project"></span><span class="separator">/</span><span id="chat-title">新对话</span></div><div id="menu" class="popup" hidden><button id="find">查找对话 Ctrl+F</button><button id="export">导出完整对话</button><button id="rename">重命名对话</button><button id="refresh">重新读取项目进度</button><button id="login">ChatGPT 登录</button><button id="attachDiagnostics">引用项目诊断</button><button id="attachGitDiff">引用 Git 差异</button><button id="attachFolder">引用文件夹</button><button id="usage">快速查看用量</button><button id="settings">会话与 Codex 配置</button><button id="delete" class="danger">删除本地记录</button></div></header>
<aside id="history-panel" class="history-panel" hidden><div class="history-heading"><strong>项目对话</strong><button id="close-history" class="icon-button" aria-label="关闭历史">×</button></div><input id="history-search" type="search" placeholder="搜索对话…" aria-label="搜索对话"><div id="history-list" class="history-list"></div></aside>
<nav id="chat-tabs" class="chat-tabs" role="tablist" aria-label="项目对话"></nav>
<div id="find-bar" class="find-bar" hidden><input id="find-query" type="search" maxlength="200" placeholder="查找当前对话" aria-label="查找当前对话"><span id="find-count" aria-live="polite">0/0</span><button id="find-prev" aria-label="上一条匹配">↑</button><button id="find-next" aria-label="下一条匹配">↓</button><button id="find-close" aria-label="关闭查找">×</button></div><main id="messages" class="messages" aria-label="对话内容"></main><button id="scroll-bottom" class="scroll-bottom" hidden>↓ 最新消息</button>
<details id="task-panel" class="task-panel" hidden><summary>任务过程 <span id="task-count"></span></summary><div class="task-controls"><select id="task-filter" aria-label="任务轮次"><option value="all">所有轮次</option></select><button id="task-failures" aria-pressed="false">仅失败</button><span class="spacer"></span><button id="task-copy">复制日志</button></div><div id="task-empty" class="task-empty" hidden>没有匹配步骤</div><div id="task-list" class="task-list"></div></details>
<section id="review" class="review" hidden><div class="review-title"><strong title="本轮期间观察到的文本变化，可能包含终端或手动编辑；恢复前请查看差异">本轮改动</strong><select id="checkpoint-select" aria-label="改动检查点"></select><span id="review-count"></span><div class="spacer"></div><button id="changes" class="text-button">Git</button></div><div id="review-files"></div></section>
<footer class="footer"><div id="activity" class="activity" hidden><span class="pulse"></span><span id="activity-text"></span></div><div id="warning" class="warning" role="alert" hidden></div><div class="composer"><div id="quick-actions" class="quick-actions" role="listbox" aria-label="聊天快捷操作" hidden></div><div id="attachments" class="attachments"></div><textarea id="input" placeholder="输入指令…" aria-controls="quick-actions" aria-expanded="false" aria-label="消息" rows="1" maxlength="100000" disabled></textarea><div class="composer-controls"><select id="mode" aria-label="工作模式"><option value="agent">Agent</option><option value="ask">Ask</option><option value="plan">Plan</option></select><select id="model" aria-label="模型"></select><select id="effort" aria-label="推理强度"></select><button id="attach" class="composer-action" title="引用文件" aria-label="引用文件">@</button><button id="attachCurrent" class="composer-action" title="引用选区" aria-label="引用选区">&lt;/&gt;</button><button id="send" class="send" title="发送消息" aria-label="发送消息">↑</button></div></div><div class="footer-meta"><span id="status" role="status">加载中</span><span id="draft-state" role="status"></span><span class="spacer"></span><span id="plan">ChatGPT</span><button id="folder" class="icon-button" title="打开文件夹" aria-label="打开文件夹">⌂</button><button id="terminal" class="icon-button" title="显示终端" aria-label="显示终端">›_</button></div></footer>
<script nonce="__NONCE__">__MARKDOWN__
__FIND__
__ACTIONS__
__SCRIPT__</script>
</body></html>
