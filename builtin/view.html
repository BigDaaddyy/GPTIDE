<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-__NONCE__'; script-src 'nonce-__NONCE__';"><meta name="viewport" content="width=device-width, initial-scale=1"><style nonce="__NONCE__">__STYLE__</style></head>
<body>
<header class="header"><div class="toolbar"><strong>Chat</strong><span id="connection" class="connection" title="会员连接状态"></span><div class="spacer"></div><button id="history" class="icon-button" title="聊天历史" aria-label="聊天历史">◷</button><button id="new" class="icon-button" title="新对话 Ctrl+Shift+L" aria-label="新对话">＋</button><button id="more" class="icon-button" title="更多操作" aria-label="更多操作">⋯</button></div><div class="breadcrumb"><span id="project"></span><span class="separator">/</span><span id="chat-title">新对话</span></div><div id="menu" class="popup" hidden><button id="rename">重命名对话</button><button id="refresh">重新读取项目进度</button><button id="login">ChatGPT 登录</button><button id="settings">设置</button><button id="delete" class="danger">删除本地记录</button></div></header>
<aside id="history-panel" class="history-panel" hidden><div class="history-heading"><strong>项目对话</strong><button id="close-history" class="icon-button" aria-label="关闭历史">×</button></div><input id="history-search" type="search" placeholder="搜索对话…" aria-label="搜索对话"><div id="history-list" class="history-list"></div></aside>
<main id="messages" class="messages" aria-label="对话内容"></main><button id="scroll-bottom" class="scroll-bottom" hidden>↓ 最新消息</button>
<details id="task-panel" class="task-panel" hidden><summary>任务过程 <span id="task-count"></span></summary><div id="task-list" class="task-list"></div></details>
<section id="review" class="review" hidden><div class="review-title"><strong>本轮修改</strong><span id="review-count"></span><div class="spacer"></div><button id="changes" class="text-button">Git</button></div><div id="review-files"></div></section>
<footer class="footer"><div id="activity" class="activity" hidden><span class="pulse"></span><span id="activity-text"></span></div><div id="warning" class="warning" role="alert" hidden></div><div class="composer"><div id="attachments" class="attachments"></div><textarea id="input" placeholder="计划、搜索、编写代码… 输入 @ 引用文件" aria-label="消息" rows="3"></textarea><div class="composer-tools"><button id="attach" class="text-button" title="选择项目文件">@ 文件</button><button id="attachCurrent" class="text-button" title="附上当前文件或选中代码">当前代码</button><div class="spacer"></div><span class="shortcut">Enter 发送</span></div><div class="composer-controls"><select id="mode" aria-label="工作模式"><option value="agent">Agent</option><option value="ask">Ask</option><option value="plan">Plan</option></select><select id="model" aria-label="模型"></select><select id="effort" aria-label="推理强度"></select><button id="send" class="send" title="发送消息" aria-label="发送消息">↑</button></div></div><div class="footer-meta"><span id="status" role="status">正在加载项目</span><span class="spacer"></span><span id="plan">ChatGPT</span><button id="folder" class="icon-button" title="打开文件夹" aria-label="打开文件夹">⌂</button><button id="terminal" class="icon-button" title="显示终端" aria-label="显示终端">›_</button></div></footer>
<script nonce="__NONCE__">__MARKDOWN__
__SCRIPT__</script>
</body></html>
