<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-__NONCE__'; script-src 'nonce-__NONCE__';"><meta name="viewport" content="width=device-width, initial-scale=1"><style nonce="__NONCE__">
*{box-sizing:border-box}body{margin:0;color:var(--vscode-foreground);background:var(--vscode-sideBar-background);font:13px var(--vscode-font-family);height:100vh;display:flex;flex-direction:column}button,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--vscode-widget-border);background:transparent;border-radius:5px;padding:5px 9px}button:hover{background:var(--vscode-toolbar-hoverBackground)}button:disabled{opacity:.45;cursor:default}header{padding:14px 14px 10px;border-bottom:1px solid var(--vscode-panel-border)}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:600}.muted{color:var(--vscode-descriptionForeground);font-size:11px}.project{margin:8px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session{width:100%;background:var(--vscode-dropdown-background);border:1px solid var(--vscode-dropdown-border);padding:7px;border-radius:4px}.messages{flex:1;overflow:auto;padding:14px;min-height:0}.empty{margin:42px 4px;line-height:1.8}.empty h2{font-size:20px;font-weight:500;margin:0 0 8px}.empty p{color:var(--vscode-descriptionForeground)}.message{margin:0 0 24px}.role{font-size:11px;font-weight:600;margin-bottom:8px;color:var(--vscode-descriptionForeground)}.content{line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.user .content{background:var(--vscode-input-background);border:1px solid var(--vscode-panel-border);padding:10px;border-radius:7px}pre{overflow:auto;padding:12px;background:var(--vscode-textCodeBlock-background);border-radius:5px;white-space:pre;margin:10px 0;font-family:var(--vscode-editor-font-family)}.source{color:var(--vscode-descriptionForeground);font-size:11px;margin-bottom:18px}.footer{padding:10px 12px 12px;border-top:1px solid var(--vscode-panel-border)}.status{font-size:11px;color:var(--vscode-descriptionForeground);margin-bottom:9px;overflow-wrap:anywhere}.warning{color:var(--vscode-editorWarning-foreground);font-size:11px;margin:6px 0}.composer{border:1px solid var(--vscode-input-border,var(--vscode-widget-border));border-radius:8px;background:var(--vscode-input-background);padding:9px}.composer:focus-within{border-color:var(--vscode-focusBorder)}textarea{resize:vertical;width:100%;min-height:80px;max-height:260px;border:0;background:transparent;outline:none;line-height:1.5}.controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.controls select{background:var(--vscode-dropdown-background);border:0;max-width:160px;font-size:11px;padding:4px}.send{margin-left:auto;background:#5e6ad2;border-color:#5e6ad2;color:white}.tools{display:flex;gap:6px;margin-top:9px}.tools button{font-size:11px}.attach{font-size:11px;color:var(--vscode-descriptionForeground);display:block;margin-bottom:8px}#login{font-size:11px}
</style></head><body><header><div class="top"><span class="brand">GptIDE</span><div><button id="new" title="新对话">＋</button> <button id="refresh" title="重新读取项目进度">刷新</button></div></div><div id="project" class="project muted"></div><select id="sessions" class="session" aria-label="项目聊天记录"></select></header><main id="messages" class="messages"></main><footer class="footer"><div class="top"><div id="status" class="status" role="status"></div><button id="login">ChatGPT 登录</button></div><div id="warning" class="warning"></div><div class="composer"><textarea id="input" placeholder="描述任务，继续这个项目的进度…" aria-label="消息"></textarea><label class="attach"><input type="checkbox" id="attach"> 附上当前文件或选中的代码</label><div class="controls"><select id="mode" aria-label="工作模式"><option value="agent">Agent · 修改项目</option><option value="ask">Ask · 只读分析</option></select><select id="model" aria-label="模型"></select><button id="send" class="send">发送 ↑</button></div></div><div class="tools"><button id="folder">打开文件夹</button><button id="changes">查看修改</button><button id="terminal">终端</button><span id="plan" class="muted" style="margin-left:auto;align-self:center">Plus 会员额度</span></div></footer><script nonce="__NONCE__">
const api=acquireVsCodeApi(),el=id=>document.getElementById(id);let state={busy:false},signature='';
const post=(type,data={})=>api.postMessage({type,...data});
function textContent(node,text){node.textContent=text;return node}
function renderContent(node,text){const parts=text.split(/(```[\s\S]*?```)/g);for(const part of parts){if(part.startsWith('```')){const pre=document.createElement('pre');const code=document.createElement('code');code.textContent=part.replace(/^```[^\n]*\n?/,'').replace(/```$/,'');pre.append(code);node.append(pre)}else node.append(document.createTextNode(part))}}
function render(s){state=s;el('project').textContent=s.project?s.project:'尚未打开项目';el('project').title=s.project;el('status').textContent=s.activity||s.status;el('warning').textContent=s.warning||'';el('plan').textContent=s.account?.type==='chatgpt'?'ChatGPT '+(s.account.plan||'').toUpperCase():'会员登录';el('login').textContent=s.account?.type==='chatgpt'?'切换账号':'ChatGPT 登录';el('send').textContent=s.busy?'停止 ■':'发送 ↑';el('input').disabled=s.busy;for(const id of ['new','refresh','sessions','model','mode','folder'])el(id).disabled=s.busy;
el('sessions').replaceChildren();const empty=new Option('新对话','');el('sessions').add(empty);for(const c of s.chats)el('sessions').add(new Option((c.source==='cursor'?'Cursor · ':'')+c.name,c.id));el('sessions').value=s.activeId||'';
el('model').replaceChildren();if(!s.models.length)el('model').add(new Option('登录后加载模型',''));for(const m of s.models)el('model').add(new Option(m.displayName||m.model,m.model));el('model').value=s.model;
const sig=JSON.stringify([s.activeId,s.messages]);if(sig===signature)return;signature=sig;const box=el('messages');const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;box.replaceChildren();if(!s.messages.length){const empty=document.createElement('div');empty.className='empty';const h=document.createElement('h2');h.textContent='从项目进度继续';const p=document.createElement('p');p.textContent='打开文件夹后，自动读取本项目的聊天记录和 Cursor 历史。登录 ChatGPT，即可使用会员模型处理项目。';empty.append(h,p);box.append(empty)}if(s.source==='cursor'){const source=document.createElement('div');source.className='source';source.textContent='已读取 Cursor 历史。发送消息时会以此为背景创建 GptIDE 对话。';box.append(source)}for(const m of s.messages){const item=document.createElement('section');item.className='message '+m.role;const role=document.createElement('div');role.className='role';role.textContent=m.role==='user'?'你':s.source==='cursor'?'Cursor':'AI';const content=document.createElement('div');content.className='content';renderContent(content,m.text);item.append(role,content);box.append(item)}if(atBottom||!s.busy)box.scrollTop=box.scrollHeight;}
window.addEventListener('message',e=>{if(e.data.type==='state')render(e.data)});
el('send').onclick=()=>{if(state.busy){post('stop');return}const text=el('input').value.trim();if(text){post('send',{text,mode:el('mode').value,attach:el('attach').checked});el('input').value=''}};
el('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();el('send').click()}};
for(const id of ['new','refresh','login','folder','changes','terminal'])el(id).onclick=()=>post(id);
el('sessions').onchange=()=>post('select',{id:el('sessions').value});el('model').onchange=()=>post('model',{value:el('model').value});post('ready');
</script></body></html>
